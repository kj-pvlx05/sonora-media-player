name: Deploy SONORA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Test Java DSA Backend Data Structures
  test-dsa-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Core DSA Unit Tests (PlaybackQueue & MediaLinkedList)
        run: |
          cd backend
          ./mvnw test -Dtest=MediaLinkedListTest,PlaybackQueueTest

  # Job 2: Build Next.js Static Export for GitHub Pages
  build-frontend:
    runs-on: ubuntu-latest
    needs: test-dsa-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sonora/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Frontend Dependencies
        run: |
          cd sonora
          npm ci

      - name: Build Next.js Static Export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/sonora-media-player"
        run: |
          cd sonora
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sonora/out

  # Job 3: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
